[agents."cricket-judgement-low"]
description = "Fast low-effort conscience check using contextual judgement. Use for a second opinion, rubber duck, or design partnership when priority, proportion, or a wait/gate may be drifting. Do not use for artefact or plan review, or to repeat a known verdict. Good: test whether a named next action serves its consumer. Bad: ask Cricket to review an artefact. Returns ON-TRACK, DRIFTING, or WRONG-PRIORITY with evidence and one redirection."
config_file = "agents/cricket-judgement-low.toml"

[agents."cricket-judgement-medium"]
description = "Fast medium-effort conscience check using contextual judgement. Use for a second opinion, rubber duck, or design partnership when priority, proportion, or a wait/gate may be drifting. Do not use for artefact or plan review, or to repeat a known verdict. Good: test whether a named next action serves its consumer. Bad: ask Cricket to review an artefact. Returns ON-TRACK, DRIFTING, or WRONG-PRIORITY with evidence and one redirection."
config_file = "agents/cricket-judgement-medium.toml"

[agents."cricket-procedure-xhigh"]
description = "Fast xhigh-effort conscience check using a compiled decision procedure with quote-anchored evidence and a mechanical verdict table. Use for a reproducible second opinion when priority, proportion, or a wait/gate may be drifting. Do not use for frame-free perspectives or artefact and plan review. Good: supply the exact six-field frame for a mechanical verdict. Bad: ask it to explore a repository or review an artefact. Returns ON-TRACK, DRIFTING, or WRONG-PRIORITY with one redirection."
config_file = "agents/cricket-procedure-xhigh.toml"
